# Minimal Supabase CLI config for the Aura project.
# project_id is a local identifier; the live project is selected with
# `--project-ref` or `supabase link`.
project_id = "aura-dating"

[functions.delete-account]
verify_jwt = true

[functions.notify]
verify_jwt = true

# RevenueCat calls this without a Supabase JWT — auth is the shared secret
[functions.revenuecat-webhook]
verify_jwt = false

[functions.moderate-image]
verify_jwt = true

[functions.ticket-availability]
verify_jwt = true

# Ticket Tailor calls this without a Supabase JWT — auth is the shared secret
[functions.tickettailor-webhook]
verify_jwt = false

# Persona calls this without a Supabase JWT — auth is the shared secret
[functions.persona-webhook]
verify_jwt = false

# Matching is cross-user, so it runs with the service role and is invoked
# by ops or an external cron rather than by the app.
[functions.blind-match]
verify_jwt = false
